name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      paseo_version:
        description: 'Paseo 版本（留空 = 自动取最新 release）'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE: pikapeek/paseo

jobs:
  publish:
    name: Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Paseo version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          MANUAL='${{ github.event.inputs.paseo_version }}'

          if [[ -n "${MANUAL}" ]]; then
            VER="${MANUAL}"
            echo "::notice::手动指定: ${VER}"
          else
            echo '→ 查询 getpaseo/paseo/releases/latest'
            JSON="$(curl -sSf --retry 2 --connect-timeout 15 \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              'https://api.github.com/repos/getpaseo/paseo/releases/latest')"
            VER="$(echo "${JSON}" | jq -r '.tag_name')"
            [[ -z "${VER}" || "${VER}" == 'null' ]] && { echo '::error::无法获取 Paseo 版本'; exit 1; }
            echo "→ 最新: ${VER}"
          fi
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"
          echo "::notice title=Paseo version::${VER}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Summary
        if: always()
        shell: bash
        run: |
          VER='${{ steps.version.outputs.version }}'
          FULL="${REGISTRY}/${IMAGE}"
          cat <<EOF >> "${GITHUB_STEP_SUMMARY}"
          ## 🚀 已发布

          | | |
          |---|---|
          | **镜像** | \`${FULL}\` |
          | **Paseo** | \`${VER}\` |
          | **拉取** | \`docker pull ${FULL}:${VER}\` |
          EOF
